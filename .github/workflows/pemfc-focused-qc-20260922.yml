name: Focused PEMFC scientific data QC 20260922
on:
  push:
    branches: [research/pemfc-quality-audit-20260922]
    paths: [scripts/pemfc_final_qc_20260922.py, .github/workflows/pemfc-focused-qc-20260922.yml]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35711068883
          name: PEMFC_STAGE3_CANDIDATE_NOT_APPROVED
          path: previous_artifact
      - run: |
          unzip -qo previous_artifact/PEMFC_STAGE3_CANDIDATE_NOT_APPROVED.zip
          pip install requests numpy pandas scipy openpyxl xlrd mat-io
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full p7zip-rar
      - name: Measure content quality and semantics
        run: python scripts/pemfc_final_qc_20260922.py
      - name: Preserve numerical findings on isolated branch
        if: always()
        run: |
          if [ -d pemfc_final_qc ]; then
            git config user.name 'public-data-audit'
            git config user.email 'public-data-audit@users.noreply.github.com'
            git add pemfc_final_qc/*.json
            git diff --cached --quiet || git commit -m 'Record EIS and MATLAB-table numerical audit with explicit limitations'
            git push origin HEAD:research/pemfc-quality-audit-20260922
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PEMFC_FOCUSED_QC_EVIDENCE
          path: PEMFC_FOCUSED_QC_EVIDENCE.zip
          retention-days: 14
          compression-level: 0
