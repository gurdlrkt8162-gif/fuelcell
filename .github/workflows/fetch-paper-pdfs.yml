name: Fetch legally accessible paper PDFs

on:
  push:
    branches: [paper-pdf-fetch-20260923]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run enhanced legal PDF discovery
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf beautifulsoup4
          awk '/python - <<'\''PY'\''/{flag=1; next} /^          PY$/{flag=0} flag {sub(/^          /, ""); print}' .github/workflows/fetch-missing-paper-pdfs.yml > /tmp/fetch_missing_papers.py
          test -s /tmp/fetch_missing_papers.py
          python /tmp/fetch_missing_papers.py
      - name: Upload verified results
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-missing-paper-pdfs
          path: missing_bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
