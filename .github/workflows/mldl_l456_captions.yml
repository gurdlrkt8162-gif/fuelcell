name: MLDL Lecture 4-6 transcript archive
on:
  push:
    branches: [mldl-l456-evidence-20260928]
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download transcript pages
        shell: bash
        run: |
          set -u
          rm -rf evidence && mkdir -p evidence/transcripts evidence/logs
          for VID in AyWYU2mmhKs qArmG1FPQII 4SDi3kO0748; do
            curl --http1.1 -A 'Mozilla/5.0' -L --retry 5 --retry-all-errors --max-time 120 "https://2outube.com/watch?format=json&v=$VID" -o "evidence/transcripts/${VID}.html" >"evidence/logs/${VID}.log" 2>&1 || true
          done
          find evidence -type f -printf '%p %s bytes\n' | sort > evidence/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mldl-lecture4-6-transcript-pages
          path: evidence
          retention-days: 7
