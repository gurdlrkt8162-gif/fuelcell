name: MLDL Lecture 4-6 captions
on:
  push:
    branches: [mldl-l456-evidence-20260928]
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install yt tools
        run: python -m pip install yt-dlp youtube-transcript-api
      - name: Fetch captions and metadata
        run: |
          mkdir -p evidence/captions evidence/metadata evidence/logs
          for VID in AyWYU2mmhKs qArmG1FPQII 4SDi3kO0748; do
            URL="https://www.youtube.com/watch?v=${VID}"
            yt-dlp --dump-single-json --no-playlist "$URL" > "evidence/metadata/${VID}.json" 2> "evidence/logs/${VID}.metadata.log" || true
            yt-dlp --skip-download --write-subs --write-auto-subs --sub-langs 'ko.*,en.*' --sub-format 'vtt/best' --convert-subs vtt --no-playlist -o "evidence/captions/${VID}.%(language)s.%(ext)s" "$URL" > "evidence/logs/${VID}.subs.log" 2>&1 || true
          done
          python - <<'PY'
          import json, traceback
          from pathlib import Path
          from youtube_transcript_api import YouTubeTranscriptApi
          out=Path('evidence/captions'); logs=Path('evidence/logs')
          for vid in ['AyWYU2mmhKs','qArmG1FPQII','4SDi3kO0748']:
              notes=[]
              try:
                  api=YouTubeTranscriptApi()
                  transcripts=api.list(vid)
                  meta=[]
                  for tr in transcripts:
                      meta.append({'language':tr.language,'language_code':tr.language_code,'is_generated':tr.is_generated,'is_translatable':tr.is_translatable})
                      try:
                          rows=[]
                          for x in tr.fetch():
                              rows.append({'text':x.text,'start':x.start,'duration':x.duration})
                          tag=('auto' if tr.is_generated else 'manual')
                          code=tr.language_code.replace('/','_')
                          (out/f'{vid}.{code}.{tag}.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
                          with (out/f'{vid}.{code}.{tag}.txt').open('w',encoding='utf-8') as f:
                              for r in rows:
                                  sec=float(r['start']); h=int(sec//3600); m=int((sec%3600)//60); s=int(sec%60)
                                  stamp=f'{h}:{m:02d}:{s:02d}' if h else f'{m}:{s:02d}'
                                  f.write(f'[{stamp}] {r["text"]}\n')
                      except Exception:
                          notes.append(traceback.format_exc())
                  (out/f'{vid}.tracks.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
              except Exception:
                  notes.append(traceback.format_exc())
              (logs/f'{vid}.yta.log').write_text('\n'.join(notes),encoding='utf-8')
          PY
          find evidence -type f -printf '%p %s bytes\n' | sort > evidence/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mldl-lecture4-6-captions
          path: evidence
          retention-days: 7
