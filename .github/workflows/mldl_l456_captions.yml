name: MLDL Lecture 4-6 caption probe
on:
  push:
    branches: [mldl-l456-evidence-20260928]
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Probe and download public caption endpoints
        shell: bash
        run: |
          set -u
          rm -rf evidence && mkdir -p evidence/captions evidence/logs
          INSTANCES=(
            'https://inv.nadeko.net'
            'https://invidious.f5.si'
            'https://yt.chocolatemoo53.com'
            'https://invidious.tiekoetter.com'
            'https://invidious.nerdvpn.de'
          )
          for VID in AyWYU2mmhKs qArmG1FPQII 4SDi3kO0748; do
            FOUND=0
            for BASE in "${INSTANCES[@]}"; do
              HOST=$(echo "$BASE" | sed 's#https://##;s#[^A-Za-z0-9]#_#g')
              curl -A 'Mozilla/5.0' -sS -L --max-time 30 -w '%{http_code} %{size_download}\n' -o "evidence/logs/${VID}.${HOST}.tracks.body" "$BASE/api/v1/captions/$VID" > "evidence/logs/${VID}.${HOST}.tracks.status" 2>&1 || true
              curl -A 'Mozilla/5.0' -sS -L --max-time 30 -G --data-urlencode 'label=Korean (auto-generated)' -w '%{http_code} %{size_download}\n' -o "evidence/logs/${VID}.${HOST}.ko.body" "$BASE/api/v1/captions/$VID" > "evidence/logs/${VID}.${HOST}.ko.status" 2>&1 || true
              SIZE=$(wc -c < "evidence/logs/${VID}.${HOST}.ko.body" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 100 ]; then
                cp "evidence/logs/${VID}.${HOST}.ko.body" "evidence/captions/${VID}.ko.auto.vtt"
                echo "$BASE $SIZE" > "evidence/captions/${VID}.source.txt"
                FOUND=1
                break
              fi
            done
            echo "found=$FOUND" > "evidence/logs/${VID}.result.txt"
          done
          find evidence -type f -printf '%p %s bytes\n' | sort > evidence/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mldl-lecture4-6-caption-probe
          path: evidence
          retention-days: 7
