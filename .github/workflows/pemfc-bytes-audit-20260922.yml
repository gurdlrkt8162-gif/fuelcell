name: Public PEMFC raw bytes and numerical audit 20260922
on:
  push:
    branches: [research/pemfc-quality-audit-20260922]
    paths: [scripts/pemfc_audit_bytes_20260922.py, .github/workflows/pemfc-bytes-audit-20260922.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data parsers only
        run: |
          pip install requests numpy pandas scipy h5py openpyxl xlrd beautifulsoup4 playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full p7zip-rar
      - name: Download and inspect original public datasets
        run: python scripts/pemfc_audit_bytes_20260922.py
      - name: Preserve actual numerical inspection in isolated audit branch
        if: always()
        run: |
          if [ -d pemfc_numeric_audit ]; then
            git config user.name 'public-data-audit'
            git config user.email 'public-data-audit@users.noreply.github.com'
            git add pemfc_numeric_audit
            git diff --cached --quiet || git commit -m 'Record actual PEMFC raw-file parsing and quality findings'
            git push origin HEAD:research/pemfc-quality-audit-20260922
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PEMFC_CANDIDATE_RAW_NOT_APPROVED
          path: PEMFC_CANDIDATE_RAW_NOT_APPROVED.zip
          retention-days: 14
          compression-level: 0
