name: MLDL Lecture 7-9 public evidence 20261015
on:
  push:
    branches: ['mldl-l789-evidence-20261015']
    paths: ['.github/workflows/mldl_l789_evidence_20261015.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Read public interactive transcripts
        shell: bash
        run: |
          mkdir -p artifact
          cat > /tmp/browse_mldl789.py <<'PY'
          import asyncio,json,pathlib,re
          from playwright.async_api import async_playwright
          ROOT=pathlib.Path('artifact')
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              ctx=await browser.new_context(viewport={'width':1440,'height':1000})
              for lec,vid in [(7,'cvZxA04cj8w'),(8,'yDiAJ6FbhMM'),(9,'A0aJg5LpToo')]:
                out=ROOT/f'L{lec}';out.mkdir(exist_ok=True)
                page=await ctx.new_page();responses=[];tasks=[]
                async def capture(resp):
                  if 'youtube-transcript.ai' not in resp.url:return
                  try:
                    ct=resp.headers.get('content-type','')
                    if 'json' in ct:
                      text=await resp.text()
                      if len(text)>300 and len(text)<2500000:
                        responses.append({'url':resp.url.split('?')[0],'status':resp.status,'body':text})
                  except Exception:pass
                page.on('response',lambda r:tasks.append(asyncio.create_task(capture(r))))
                try:
                  await page.goto(f'https://youtube-transcript.ai/transcript?v={vid}',wait_until='domcontentloaded',timeout=60000)
                  await page.wait_for_timeout(35000)
                  text=await page.locator('body').inner_text()
                  (out/'workspace.txt').write_text(text)
                  await page.screenshot(path=str(out/'workspace.png'),full_page=False)
                  html=await page.content();(out/'workspace.html').write_text(html)
                  if tasks:await asyncio.gather(*tasks,return_exceptions=True)
                  (out/'public_caption_responses.json').write_text(json.dumps(responses,ensure_ascii=False,indent=2))
                  print(lec,len(text),len(responses),text[-600:])
                except Exception as e:(out/'error.txt').write_text(str(e))
                await page.close()
              await browser.close()
          asyncio.run(main())
          PY
          python /tmp/browse_mldl789.py
      - name: Retain evidence for this PDF task
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mldl-l789-browser-evidence-20261015
          path: artifact/
          retention-days: 1
          compression-level: 6
