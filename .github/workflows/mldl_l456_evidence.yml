name: MLDL Lecture 4-6 Evidence
on:
  pull_request:
    paths:
      - 'tools/_mldl_l456_trigger.txt'
      - 'tools/_mldl_l456_evidence.py'
      - '.github/workflows/mldl_l456_evidence.yml'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils nodejs
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp youtube-transcript-api requests
      - name: Collect evidence
        run: python tools/_mldl_l456_evidence.py
      - name: Inventory
        run: |
          find artifact -type f -printf '%p %s bytes\n' | sort > artifact/file_inventory.txt
          du -sh artifact | tee artifact/size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mldl-l456-evidence
          path: artifact
          retention-days: 1
          compression-level: 6
