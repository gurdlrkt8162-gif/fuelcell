name: Summarize parsed PEMFC candidate facts
on:
  push:
    branches: [research/pemfc-quality-audit-20260922]
    paths:
      - scripts/summarize_pemfc_candidate_profiles.py
      - .github/workflows/summarize-pemfc-candidate-profiles.yml
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/summarize_pemfc_candidate_profiles.py
      - name: Preserve reduced facts
        run: |
          git config user.name 'pemfc-public-data-audit'
          git config user.email 'pemfc-public-data-audit@users.noreply.github.com'
          git add pemfc_admission_facts
          git diff --cached --quiet || git commit -m 'Record concise facts for PEMFC candidate admission'
          git push origin HEAD:research/pemfc-quality-audit-20260922
