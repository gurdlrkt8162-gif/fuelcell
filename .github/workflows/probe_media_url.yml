name: Probe AccurateScribe media duration
on:
  push:
    branches: [hydrogen-guide-full-20260928]
    paths: [media_probe_nonce.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hydrogen-guide-full-20260928
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Probe signed media
        run: |
          URL=$(tail -n 1 debug_exact_media_urls.txt)
          curl -sSIL "$URL" > media_probe_headers.txt || true
          curl -L --fail "$URL" -o media_probe.mp3
          stat -c '%s' media_probe.mp3 > media_probe_size.txt
          ffprobe -v error -show_entries format=duration,size,bit_rate -of json media_probe.mp3 > media_probe_ffprobe.json
          ffmpeg -hide_banner -i media_probe.mp3 -af silencedetect=n=-45dB:d=1 -f null - 2> media_probe_silence.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f media_probe_headers.txt media_probe_size.txt media_probe_ffprobe.json media_probe_silence.txt
          git commit -m 'Probe AccurateScribe signed media duration' || true
          git push origin HEAD:hydrogen-guide-full-20260928
