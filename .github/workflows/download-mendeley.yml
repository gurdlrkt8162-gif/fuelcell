name: Download Mendeley public datasets

on:
  push:
    paths:
      - '.github/workflows/download-mendeley.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: FC03, ds: n5csdjfg3c, ver: '2'}
          - {id: FC06, ds: zdz65vcjzc, ver: '1'}
          - {id: FC07, ds: mc46tw9t8m, ver: '1'}
          - {id: FC08, ds: m9m2gmcr6k, ver: '1'}
          - {id: FC09, ds: 4sfyzcc39j, ver: '1'}
          - {id: FC12, ds: sp4pc8w9xh, ver: '1'}
          - {id: FC13, ds: jy5vxystwd, ver: '1'}
          - {id: FC14, ds: pn95bsbhv9, ver: '1'}
          - {id: FC15, ds: 5wj6zj3sv4, ver: '1'}
          - {id: BAT08, ds: n3b54nsw8m, ver: '9'}
          - {id: BAT09, ds: q4p8d7kfw4, ver: '1'}
          - {id: MIS04, ds: tf4ym6fsvc, ver: '1'}
          - {id: MIS05, ds: ypt9mwg5nt, ver: '1'}
          - {id: BOP04, ds: m268jsw339, ver: '3'}
          - {id: BOP05, ds: x2hrn4vfrt, ver: '1'}
          - {id: BOP06, ds: 63gjxpn7s6, ver: '1'}
          - {id: BOP07, ds: zjspz5gffh, ver: '1'}
          - {id: BOP08, ds: mn2wwp9r23, ver: '1'}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Download ${{ matrix.id }}
        run: |
          set -Eeuo pipefail
          python scripts/mendeley_download.py '${{ matrix.ds }}' '${{ matrix.ver }}' --out 'bundle/${{ matrix.id }}' --timeout-ms 600000
          find 'bundle/${{ matrix.id }}' -type f -printf '%p %s bytes\n' | sort > 'bundle/${{ matrix.id }}/FILE_LIST.txt'
          for f in bundle/${{ matrix.id }}/*; do
            case "$f" in
              *.zip) unzip -t "$f" ;;
            esac
          done
          find 'bundle/${{ matrix.id }}' -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > 'bundle/${{ matrix.id }}/SHA256SUMS.txt'
      - name: Upload ${{ matrix.id }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: mendeley-${{ matrix.id }}
          path: bundle/${{ matrix.id }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
