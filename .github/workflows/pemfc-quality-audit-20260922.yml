name: Public PEMFC metadata and quality audit 20260922
on:
  push:
    branches: [research/pemfc-quality-audit-20260922]
    paths: [scripts/pemfc_audit_metadata_20260922.py, .github/workflows/pemfc-quality-audit-20260922.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-data inspection dependencies
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Inspect candidate metadata and bounded raw samples
        run: python scripts/pemfc_audit_metadata_20260922.py
      - name: Preserve actual inspection evidence in isolated branch
        if: always()
        run: |
          if [ -d pemfc_candidate_audit ]; then
            git config user.name 'public-data-audit'
            git config user.email 'public-data-audit@users.noreply.github.com'
            git add pemfc_candidate_audit
            git diff --cached --quiet || git commit -m 'Record actual public PEMFC metadata and raw-sample inspection'
            git push origin HEAD:research/pemfc-quality-audit-20260922
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PEMFC_CANDIDATE_INSPECTION_NOT_APPROVED
          path: pemfc_candidate_audit
          retention-days: 14
