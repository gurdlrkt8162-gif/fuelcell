name: Build full hydrogen guide

on:
  push:
    branches: [hydrogen-guide-full-20260928]
    paths:
      - input_urls.json

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hydrogen-guide-full-20260928
          fetch-depth: 0
      - name: Cache base PDF immediately
        run: |
          BASE_URL=$(python3 -c "import json; d=json.load(open('input_urls.json')); print(''.join(d['base_pdf_url_parts']))")
          curl -L --fail --retry 3 --retry-delay 2 "$BASE_URL" -o cached_base.pdf
          test -s cached_base.pdf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils fonts-nanum fonts-noto-cjk
      - name: Install Python dependencies and browser
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf requests beautifulsoup4 lxml faster-whisper numpy pillow playwright
          python -m playwright install chromium
      - name: Compile builders
        run: |
          python -m py_compile scripts/build_hydrogen_guide.py
          python -m py_compile scripts/run_build.py
      - name: Build final PDF
        run: |
          python -m http.server 8765 >/tmp/base-http.log 2>&1 &
          python - <<'PY'
          import json
          p='input_urls.json'
          d=json.load(open(p,encoding='utf-8'))
          d['base_pdf_url']='http://127.0.0.1:8765/cached_base.pdf'
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          python -m scripts.run_build --config input_urls.json --output output/final.pdf
      - name: Inspect final PDF
        run: |
          pdfinfo output/final.pdf
          pdftotext output/final.pdf output/final.txt
          test -s output/final.pdf
          test -s output/qa.json
          python - <<'PY'
          import json
          q=json.load(open('output/qa.json',encoding='utf-8'))
          assert q['source_pages_identified']==115
          assert not q['blank_pages']
          assert all(v['coverage_ratio'] >= 0.90 for v in q['transcripts'].values())
          print(json.dumps(q,ensure_ascii=False,indent=2))
          PY
      - name: Commit deterministic deliverables
        run: |
          cp output/final.pdf hydrogen_energy_complete_final.pdf
          cp output/qa.json hydrogen_energy_complete_final_qa.json
          cp output/mapping.csv hydrogen_energy_slide_audio_mapping.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f hydrogen_energy_complete_final.pdf hydrogen_energy_complete_final_qa.json hydrogen_energy_slide_audio_mapping.csv
          git commit -m 'Build complete hydrogen energy study guide' || true
          git push origin HEAD:hydrogen-guide-full-20260928
      - name: Upload final artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-energy-complete-guide
          path: |
            output/final.pdf
            output/qa.json
            output/transcripts
            output/mapping.csv
            output/work/browser
          if-no-files-found: warn
          retention-days: 7
