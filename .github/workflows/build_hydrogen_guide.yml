name: Build full hydrogen guide

on:
  push:
    branches: [hydrogen-guide-full-20260928]
    paths:
      - input_urls.json

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hydrogen-guide-full-20260928
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils fonts-nanum fonts-noto-cjk
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf requests beautifulsoup4 lxml faster-whisper numpy pillow
      - name: Compile builder
        run: python -m py_compile scripts/build_hydrogen_guide.py
      - name: Build final PDF
        run: python scripts/build_hydrogen_guide.py --config input_urls.json --output output/final.pdf
      - name: Inspect final PDF
        run: |
          pdfinfo output/final.pdf
          pdftotext output/final.pdf output/final.txt
          test -s output/final.pdf
          test -s output/qa.json
          grep -q '"source_pages_identified": 115' output/qa.json
      - name: Commit deterministic deliverables
        run: |
          cp output/final.pdf hydrogen_energy_complete_final.pdf
          cp output/qa.json hydrogen_energy_complete_final_qa.json
          cp output/mapping.csv hydrogen_energy_slide_audio_mapping.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f hydrogen_energy_complete_final.pdf hydrogen_energy_complete_final_qa.json hydrogen_energy_slide_audio_mapping.csv
          git commit -m 'Build complete hydrogen energy study guide' || true
          git push origin HEAD:hydrogen-guide-full-20260928
      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-energy-complete-guide
          path: |
            output/final.pdf
            output/qa.json
            output/transcripts
            output/mapping.csv
          retention-days: 7
