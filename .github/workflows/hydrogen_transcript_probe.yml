name: Hydrogen transcript probe
on:
  push:
    paths:
      - 'tools/hydrogen_transcript_probe.py'
      - '.github/workflows/hydrogen_transcript_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/hydrogen_transcript_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: hydrogen-transcript-probe
          path: probe_out
          retention-days: 2
