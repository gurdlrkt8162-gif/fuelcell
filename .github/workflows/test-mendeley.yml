name: Test Mendeley public download

on:
  push:
    paths:
      - '.github/workflows/test-mendeley.yml'
      - 'scripts/mendeley_download.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Download AERO4River dataset
        run: |
          set -Eeuo pipefail
          python scripts/mendeley_download.py tf4ym6fsvc 1 --out bundle/MIS04
          find bundle -type f -maxdepth 3 -printf '%p %s bytes\n'
          file bundle/MIS04/*
          for f in bundle/MIS04/*; do
            case "$f" in
              *.zip) unzip -t "$f" ;;
            esac
          done
          find bundle -type f -print0 | sort -z | xargs -0 sha256sum > bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mendeley-test
          path: bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
