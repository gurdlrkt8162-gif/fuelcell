name: Download OSF public datasets

on:
  push:
    paths:
      - '.github/workflows/download-osf.yml'
      - 'scripts/download_osf.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: BAT12, node: j2sn4}
          - {id: BAT14, node: 9ceav}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check requests
      - name: Download and verify ${{ matrix.id }}
        run: python scripts/download_osf.py '${{ matrix.node }}' --id '${{ matrix.id }}' --out bundle
      - uses: actions/upload-artifact@v4
        with:
          name: osf-${{ matrix.id }}
          path: bundle/${{ matrix.id }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
