name: Download corrected BAT09 EIS dataset

on:
  push:
    paths:
      - '.github/workflows/download-bat09-correct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Download BAT09 g7ncmhrcrz version 2
        run: |
          set -Eeuo pipefail
          python scripts/mendeley_download.py g7ncmhrcrz 2 --out bundle/BAT09 --timeout-ms 600000
          find bundle/BAT09 -type f -printf '%p %s bytes\n' | sort > bundle/BAT09/FILE_LIST.txt
          for f in bundle/BAT09/*; do case "$f" in *.zip) unzip -t "$f" ;; esac; done
          find bundle/BAT09 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > bundle/BAT09/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mendeley-BAT09-corrected
          path: bundle/BAT09
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
