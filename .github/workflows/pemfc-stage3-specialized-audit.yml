name: PEMFC stage3 specialized raw-data audit
on:
  push:
    branches: [research/pemfc-quality-audit-20260922]
    paths:
      - scripts/pemfc_stage3_specialized_audit.py
      - .github/workflows/pemfc-stage3-specialized-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded scientific parsers
        run: |
          pip install requests numpy pandas scipy h5py openpyxl xlrd beautifulsoup4 python-docx
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full p7zip-rar
      - name: Download and parse specialized public candidates
        run: python scripts/pemfc_stage3_specialized_audit.py
      - name: Preserve audit evidence on isolated branch
        if: always()
        run: |
          if [ -d pemfc_stage3_audit ]; then
            git config user.name 'pemfc-public-data-audit'
            git config user.email 'pemfc-public-data-audit@users.noreply.github.com'
            git add pemfc_stage3_audit
            git diff --cached --quiet || git commit -m 'Record stage3 specialized PEMFC QC evidence'
            git push origin HEAD:research/pemfc-quality-audit-20260922
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PEMFC_STAGE3_SPECIALIZED_CANDIDATES_NOT_APPROVED
          path: PEMFC_STAGE3_SPECIALIZED_CANDIDATES_NOT_APPROVED.zip
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
